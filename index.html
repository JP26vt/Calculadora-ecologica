<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de huella ecológica</title>
<style>
  :root {
    --bosque: #1f4d3a;
    --musgo: #4f8a5b;
    --hoja: #dff0d8;
    --mar: #1d6f8a;
    --arena: #f3f7f1;
    --tinta: #1c2b24;
    --borde: #b9d3bf;
    --error: #a43a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--tinta);
    background: var(--arena);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(160deg, var(--bosque), var(--mar));
    color: #fff;
    padding: 2.5rem 1rem 3rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 .75rem;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.9rem, 6vw, 3rem);
    letter-spacing: .01em;
  }
  header p {
    max-width: 38rem;
    margin: 0 auto;
    font-size: 1.05rem;
  }
  main {
    max-width: 44rem;
    margin: -1.5rem auto 3rem;
    padding: 0 1rem;
  }
  form { display: grid; gap: 1rem; }
  fieldset {
    margin: 0;
    padding: 1rem 1.25rem 1.25rem;
    background: #fff;
    border: 1px solid var(--borde);
    border-left: 6px solid var(--musgo);
    border-radius: 10px;
  }
  legend {
    padding: 0 .5rem;
    font-family: Georgia, serif;
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--bosque);
  }
  label { display: block; margin-top: .9rem; font-weight: 600; }
  label:first-of-type { margin-top: .25rem; }
  select, input[type="number"] {
    width: 100%;
    margin-top: .3rem;
    padding: .6rem .7rem;
    font: inherit;
    color: var(--tinta);
    background: #fff;
    border: 1px solid #8fb39a;
    border-radius: 6px;
  }
  select:focus, input:focus, button:focus-visible {
    outline: 3px solid var(--mar);
    outline-offset: 1px;
  }
  button {
    padding: .9rem 1rem;
    font: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    color: #fff;
    background: var(--bosque);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #153828; }
  button:disabled { opacity: .6; cursor: wait; }
  #estado {
    margin-top: 1rem;
    font-weight: 600;
    color: var(--bosque);
  }
  #resultado {
    margin-top: 1rem;
    padding: 1.1rem 1.25rem;
    white-space: pre-line;
    background: var(--hoja);
    border: 2px solid var(--musgo);
    border-radius: 10px;
  }
  #resultado.error {
    color: var(--error);
    background: #fbe9e5;
    border-color: var(--error);
  }
  [hidden] { display: none !important; }
  @media (min-width: 40rem) {
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Calculadora de huella ecológica</h1>
  <p>Si todas las personas del mundo vivieran como tú, ¿cuántos planetas Tierra harían falta? Responde estas preguntas y averígualo.</p>
</header>

<main>
  <form id="formulario">
    <fieldset>
      <legend>Alimentación</legend>
      <label for="carne">¿Cada cuánto comes carne de res o cerdo?
        <select id="carne" name="carne" required>
          <option value="Nunca">Nunca</option>
          <option value="1-2 veces por semana">1-2 veces por semana</option>
          <option value="3-5 veces por semana">3-5 veces por semana</option>
          <option value="Diario">Diario</option>
        </select>
      </label>
      <label for="local">¿Qué parte de tu comida es local o de temporada?
        <select id="local" name="local" required>
          <option value="Casi nada">Casi nada</option>
          <option value="La mitad">La mitad</option>
          <option value="Casi toda">Casi toda</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Transporte</legend>
      <label for="transporte">Medio de transporte principal
        <select id="transporte" name="transporte" required>
          <option value="Caminar o bicicleta">Caminar o bicicleta</option>
          <option value="Camión urbano">Camión urbano</option>
          <option value="Moto">Moto</option>
          <option value="Auto propio">Auto propio</option>
        </select>
      </label>
      <div class="fila">
        <label for="km">Kilómetros que recorres al día
          <input type="number" id="km" name="km" min="0" step="any" value="0" required>
        </label>
        <label for="vuelos">Vuelos en avión al año
          <input type="number" id="vuelos" name="vuelos" min="0" step="1" value="0" required>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Energía</legend>
      <div class="fila">
        <label for="aire">Horas al día de aire acondicionado en casa
          <input type="number" id="aire" name="aire" min="0" max="24" step="any" value="0" required>
        </label>
        <label for="personas">Personas que viven en tu casa
          <input type="number" id="personas" name="personas" min="1" step="1" value="1" required>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Consumo</legend>
      <div class="fila">
        <label for="ropa">Prendas nuevas que compras al mes
          <input type="number" id="ropa" name="ropa" min="0" step="1" value="0" required>
        </label>
        <label for="celular">Cada cuántos años cambias de celular
          <input type="number" id="celular" name="celular" min="1" step="any" value="2" required>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Residuos</legend>
      <label for="separa">¿Separas la basura?
        <select id="separa" name="separa" required>
          <option value="Sí">Sí</option>
          <option value="A veces">A veces</option>
          <option value="No">No</option>
        </select>
      </label>
    </fieldset>

    <button type="submit" id="boton">Calcular mi huella</button>
  </form>

  <p id="estado" role="status" aria-live="polite" hidden></p>
  <div id="resultado" role="region" aria-live="polite" hidden></div>
</main>

<script>
  // Pega aquí la URL de tu webhook de Make (Custom webhook):
  const WEBHOOK_URL = "https://hook.us2.make.com/lookzpjhnfeyltk1k2keqfc6i5xbjq9q";

  const CAMPOS = ["carne", "local", "transporte", "km", "vuelos",
                  "aire", "personas", "ropa", "celular", "separa"];

  const formulario = document.getElementById("formulario");
  const boton = document.getElementById("boton");
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");

  formulario.addEventListener("submit", async (e) => {
    e.preventDefault();

    const datos = new URLSearchParams();
    CAMPOS.forEach((nombre) => {
      datos.append(nombre, document.getElementById(nombre).value);
    });

    boton.disabled = true;
    resultado.hidden = true;
    resultado.classList.remove("error");
    estado.textContent = "Calculando tu huella...";
    estado.hidden = false;

    try {
      const respuesta = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: datos
      });
      if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
      const texto = await respuesta.text();
      resultado.textContent = texto;
    } catch (err) {
      resultado.textContent = "No se pudo calcular, intenta de nuevo.";
      resultado.classList.add("error");
    } finally {
      estado.hidden = true;
      resultado.hidden = false;
      boton.disabled = false;
      resultado.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });
</script>
</body>
</html>
